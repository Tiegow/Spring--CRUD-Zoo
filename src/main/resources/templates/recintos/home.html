<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recintos</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1><a th:href="@{/}"><i class="fa-solid fa-angle-left"></i></a> Recintos</h1>
    </div>

    <!-- Filtro -->
    <div class="container mt-3">
        <div class="card p-3 shadow-sm">
            <h5>Filtros</h5>

            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Filtrar por:</label>
                    <select id="filtroTipo" class="form-select">
                        <option value="">Nenhum filtro</option>
                        <option value="populacao">População</option>
                        <option value="area">Área Habitável</option>
                    </select>
                </div>

                <!-- População -->
                <div id="campoPopulacao" class="col-md-8 d-none">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">População mínima:</label>
                            <input id="popMin" type="number" class="form-control" min="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">População máxima:</label>
                            <input id="popMax" type="number" class="form-control" min="0">
                        </div>
                    </div>
                </div>

                <!-- Área Habitável -->
                <div id="campoArea" class="col-md-8 d-none">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Área mínima:</label>
                            <input id="areaMin" type="number" step="0.01" class="form-control" min="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Área máxima:</label>
                            <input id="areaMax" type="number" step="0.01" class="form-control" min="0">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3">
                <button id="aplicarFiltroBtn" class="btn btn-primary">Aplicar filtro</button>
                <button id="limparFiltroBtn" class="btn btn-secondary">Limpar</button>
            </div>
        </div>
    </div>

    <!-- Botão adicionar -->
    <div sec:authorize="hasAnyRole('ADMIN', 'GERENTE_OPERACOES')" class="container mt-3 mb-2 d-flex justify-content-between">
        <div></div>
        <a th:href="@{/recintos/novo}"
           class="btn btn-primary btn-lg rounded-circle d-flex align-items-center justify-content-center shadow"
           title="Adicionar recinto">
            <span><i class="fa-solid fa-plus fa-xs"></i></span>
        </a>
    </div>

    <!-- Tabela -->
    <div class="container">
        <table id="tabela-recintos" class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Status</th>
                    <th>Área Habitável</th>
                    <th>População</th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="tbody-recintos">
                <tr th:each="r : ${recintos.content}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.nome}"></td>
                    <td th:text="${r.status}"></td>
                    <td th:text="${r.areaHabitavel}"></td>
                    <td th:text="${r.populacao}"></td>
                    <td>
                        <a th:href="@{/recintos/{id}(id=${r.id})}">
                            <i class="fa-solid fa-circle-info fa-lg"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav aria-label="Page navigation" th:if="${recintos.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${recintos.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/recintos(page=${recintos.number - 1}, size=${recintos.size}, sort=${param.sort})}">Anterior</a>
                </li>

                <li class="page-item disabled"><span class="page-link" th:text="|Página ${recintos.number + 1} de ${recintos.totalPages}|"></span></li>

                <li class="page-item" th:classappend="${recintos.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/recintos(page=${recintos.number + 1}, size=${recintos.size}, sort=${param.sort})}">Próximo</a>
                </li>
            </ul>
        </nav>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/recintosPages/home.js}"></script>
</body>
</html>
