<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recintos</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4"><a th:href="@{/}"><i class="fa-solid fa-angle-left"></i></a>Recintos</h1>
    </div>

    <div class="container d-flex justify-content-around mb-2">
        <div class="d-flex align-items-start gap-2 w-100">
            <label class="visually-hidden" for="filtro-tipo">Filtrar por</label>
            <select id="filtro-tipo" class="form-select form-select-sm me-2" style="max-width:250px;">
                <option value="Filtros" selected>Filtros</option>
                <option value="Area Habitavel">Area Habitavel</option>
                <option value="Populacao">Populacao</option>
            </select>

            <div id="filtro-dinamico" class="d-flex gap-2 align-items-center me-2">
                <div class="d-none d-flex align-items-center gap-2" id="area">
                    <label for="filtro-area-maior-que">Área Habitável:</label>
                    <input type="number" id="filtro-area-maior-que" placeholder="Maior que:" class="form-control form-control-sm" style="width:120px;">
                    <input type="number" id="filtro-area-menor-que" placeholder="Menor que:" class="form-control form-control-sm" style="width:120px;">
                </div>

                <div class="d-none d-flex align-items-center gap-2" id="grupo">
                    <label for="filtro-grupo-min">População:</label>
                    <input type="number" id="filtro-grupo-min" placeholder="Mínimo:" class="form-control form-control-sm" style="width:120px;">
                    <input type="number" id="filtro-grupo-max" placeholder="Máximo:" class="form-control form-control-sm" style="width:120px;">
                </div>
            </div>


            <div class="btn-group">
                <button id="btn-aplicar-filtro" class="btn btn-primary btn-sm">Filtrar</button>
                <button id="btn-limpar-filtro" class="btn btn-outline-secondary btn-sm">Limpar</button>
            </div>
        </div>

        <div>
            <a th:href="@{/recintos/novo}"
                 class="btn btn-primary btn-lg rounded-circle d-flex align-items-center justify-content-center shadow add-especie-btn"
                 title="Adicionar recinto">
                <span><i class="fa-solid fa-plus fa-xs"></i></span>
            </a>
        </div>
    </div>

    <div class="container">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Área Habitável</th>
                    <th scope="col">Status</th>
                    <th scope="col">População</th>
                </tr>
            </thead>
            <tbody id="tabela-recintos">
                <tr th:each="recinto : ${recintos.content}">
                    <td th:text="${recinto.id}"></td>
                    <td th:text="${recinto.nome}"></td>
                    <td th:text="${recinto.areaHabitavel}"></td>
                    <td th:text="${recinto.status}"></td>
                    <td th:text="${recinto.populacao}"></td>
                    <td>
                        <a th:href="@{/recintos/{id}(id=${recinto.id})}"
                        title="Ver detalhes">
                            <i class="fa-solid fa-circle-info fa-lg"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/recintosPages/home.js}"></script>
</body>
</html>
