<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Recinto</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1><a th:href="@{/recintos}"><i class="fa-solid fa-angle-left"></i></a> Novo Recinto</h1>
    </div>

    <div class="container mt-3">
        <form id="novo-recinto-form">

            <!-- Nome -->
            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input name="nome" type="text" class="form-control" required>
            </div>

            <!-- Área Habitável (float) -->
            <div class="mb-3">
                <label class="form-label">Área Habitável (m²):</label>
                <input name="areaHabitavel" type="number" step="0.01" class="form-control">
            </div>

            <!-- Status -->
            <div class="mb-3">
                <label for="status" class="form-label">Status:</label>
                <select name="status" id="status" class="form-select" required>
                    <option value="" selected disabled>Selecione o status</option>
                    <option value="ABERTO">Aberto</option>
                    <option value="FECHADO">Fechado</option>
                    <option value="MANUTENCAO">Em Manutenção</option>
                </select>
            </div>

            <!-- Plano de dieta -->
            <div class="mb-3 p-3 border rounded bg-light">
                <h5 class="form-label">Novo Plano de Dieta</h5>
                <p class="form-text text-muted">Crie o plano de dieta que será associado a este recinto.</p>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="planoCarne" class="form-label">Quantidade de Carne (g):</label>
                        <input id="planoCarne" name="quantidadeCarne" type="number" class="form-control" value="0" required>
                    </div>
                    <div class="col-md-6">
                        <label for="planoVegetais" class="form-label">Quantidade de Vegetais (g):</label>
                        <input id="planoVegetais" name="quantidadeVegetais" type="number" class="form-control" value="0" required>
                    </div>
                </div>
            </div>

            <!-- Tratadores -->
            <div class="mb-3">
                <label class="form-label">Tratadores:</label>
                <select name="tratadorIds" id="tratadorIds" multiple class="form-select form-select-sm" style="max-width: 300px;">
                    <option th:each="t : ${tratadores}" th:value="${t.id}" th:text="${t.nome}"></option>
                </select>
            </div>

            <button class="btn btn-primary" type="submit">Criar</button>
            <a th:href="@{/recintos}" class="btn btn-secondary">Cancelar</a>

        </form>
    </div>

    <script th:src="@{/js/recintosPages/novo.js}"></script>
</body>
</html>
