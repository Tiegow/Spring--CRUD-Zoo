            <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input required type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Recinto das Aves de Rapina">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="areaHabitavel" class="form-label">Área Habitável (m²):</label>

                </div>
                <div class="col-md-6">

                        <option value="ABERTO">Aberto</option>
                        <option value="FECHADO">Fechado</option>
                        <option value="MANUTENCAO">Em Manutenção</option>
                    </select>
                </div>
            </div>

                <label for="planoDietaId" class="form-label">Plano de Dieta:</label>

                            th:value="${plano.id}"

                    </option>
                </select>
            </div>

                <select multiple class="form-select" id="tratadorIds" name="tratadorIds" size="5">

                            th:text="${tratador.nome}">
                    </option>
                </select>
                <small class="form-text text-muted">Segure Ctrl para selecionar múltiplos tratadores.</small>
            </div>

            <button id="add-submit" type="submit" class="btn btn-primary">Salvar</button>
