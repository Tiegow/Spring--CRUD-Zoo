<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Recinto</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1><a th:href="@{/recintos}"><i class="fa-solid fa-angle-left"></i></a> Novo Recinto</h1>
    </div>

    <div class="container mt-3">
        <form id="novo-recinto-form">

            <!-- Nome -->
            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input name="nome" type="text" class="form-control" required>
            </div>

            <!-- Área Habitável (float) -->
            <div class="mb-3">
                <label class="form-label">Área Habitável (m²):</label>
                <input name="areaHabitavel" type="number" step="0.01" class="form-control">
            </div>

            <!-- População -->
            <div class="mb-3">
                <label class="form-label">População:</label>
                <input name="populacao" type="number" min="0" class="form-control">
            </div>

            <!-- Tipo -->
            <div class="mb-3">
                <label class="form-label">Tipo:</label>
                <input name="tipo" type="text" class="form-control">
            </div>

            <!-- Status -->
            <div class="mb-3">
                <label class="form-label">Status:</label>
                <input name="status" type="text" class="form-control">
            </div>

            <!-- Plano de dieta -->
            <div class="mb-3">
                <label class="form-label">Plano de Dieta:</label>
                <select name="planoDietaId" class="form-select">
                    <option value="">Nenhum</option>
                    <option th:each="p : ${planosDieta}" th:value="${p.id}" th:text="${p.nome}"></option>
                </select>
            </div>

            <!-- Animais -->
            <div class="mb-3">
                <label class="form-label">Animais:</label>
                <select name="animaisIds" id="animaisIds" multiple class="form-select form-select-sm" style="max-width: 300px;">
                    <option th:each="a : ${animais}" th:value="${a.id}" th:text="${a.nome}"></option>
                </select>
            </div>

            <!-- Tratadores -->
            <div class="mb-3">
                <label class="form-label">Tratadores:</label>
                <select name="tratadorIds" id="tratadorIds" multiple class="form-select form-select-sm" style="max-width: 300px;">
                    <option th:each="t : ${tratadores}" th:value="${t.id}" th:text="${t.nome}"></option>
                </select>
            </div>

            <button class="btn btn-primary" type="submit">Criar</button>
            <a th:href="@{/recintos}" class="btn btn-secondary">Cancelar</a>

        </form>
    </div>

    <script th:src="@{/js/recintosPages/novo.js}"></script>
</body>
</html>
