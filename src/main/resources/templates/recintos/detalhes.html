<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recintos - Detalhes</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1 class="mb-4">
            <i class="fa-solid fa-house-circle-check me-2"></i>
            <span th:text="${recinto.nome}"></span>
        </h1>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-body">

                <h5 class="card-title mb-4">Detalhes do Recinto</h5>

                <dl class="row">

                    <dt class="col-sm-4">ID:</dt>
                    <dd class="col-sm-8" th:text="${recinto.id}"></dd>

                    <dt class="col-sm-4">Nome:</dt>
                    <dd class="col-sm-8" th:text="${recinto.nome}"></dd>

                    <dt class="col-sm-4">Tipo:</dt>
                    <dd class="col-sm-8" th:text="${recinto.tipo}"></dd>

                    <dt class="col-sm-4">Status:</dt>
                    <dd class="col-sm-8" th:text="${recinto.status}"></dd>

                    <dt class="col-sm-4">Área Habitável:</dt>
                    <dd class="col-sm-8" th:text="${recinto.areaHabitavel}"></dd>

                    <dt class="col-sm-4">População:</dt>
                    <dd class="col-sm-8" th:text="${recinto.populacao}"></dd>

                    <dt class="col-sm-4">Plano de Dieta:</dt>
                    <dd class="col-sm-8" th:text="${recinto.planoDietaId != null ? recinto.planoDietaId : 'Nenhum'}"></dd>

                    <dt class="col-sm-4">Animais (IDs):</dt>
                    <dd class="col-sm-8">
                        <ul class="list-group">
                            <li class="list-group-item"
                                th:each="id : ${recinto.animaisIds}"
                                th:text="'Animal ID: ' + ${id}">
                            </li>

                            <li class="list-group-item text-muted"
                                th:if="${recinto.animaisIds == null or recinto.animaisIds.isEmpty()}">
                                Nenhum animal associado.
                            </li>
                        </ul>
                    </dd>

                    <dt class="col-sm-4">Tratadores (IDs):</dt>
                    <dd class="col-sm-8">
                        <ul class="list-group">
                            <li class="list-group-item"
                                th:each="id : ${recinto.tratadorIds}"
                                th:text="'Tratador ID: ' + ${id}">
                            </li>

                            <li class="list-group-item text-muted"
                                th:if="${recinto.tratadorIds == null or recinto.tratadorIds.isEmpty()}">
                                Nenhum tratador associado.
                            </li>
                        </ul>
                    </dd>

                </dl>

                <div class="mt-3">
                    <a th:href="@{/recintos}" class="btn btn-secondary me-2">
                        <i class="fa-solid fa-arrow-left me-1"></i>Voltar
                    </a>

                    <a th:href="@{/recintos/editar/{id}(id=${recinto.id})}" class="btn btn-primary me-2">
                        <i class="fa-solid fa-pen-to-square me-1"></i>Editar
                    </a>

                    <button type="button" class="btn btn-danger" id="delete-btn"
                        th:attr="data-id=${recinto.id}">
                        <i class="fa-solid fa-trash me-1"></i>Deletar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/recintosPages/detalhes.js}"></script>

</body>
</html>
