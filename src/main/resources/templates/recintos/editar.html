<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Recinto</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>
            <a th:href="@{/recintos}">
                <i class="fa-solid fa-angle-left"></i>
            </a>
            Editar Recinto
        </h1>
        <p class="text-muted" th:text="${recinto.nome}"></p>
    </div>

    <div class="container mt-3">
        <form id="editar-recinto-form" th:attr="data-id=${recinto.id}">

            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input name="nome" type="text" class="form-control" th:value="${recinto.nome}">
            </div>

            <div class="mb-3">
                <label class="form-label">Área Habitável:</label>
                <input name="areaHabitavel" type="number" step="0.01" class="form-control" th:value="${recinto.areaHabitavel}">
            </div>

            <div class="mb-3">
                <label class="form-label">População:</label>
                <input name="populacao" type="number" class="form-control" min="0" th:value="${recinto.populacao}">
            </div>

            <div class="mb-3">
                <label class="form-label">Tipo:</label>
                <input name="tipo" type="text" class="form-control" th:value="${recinto.tipo}">
            </div>

            <div class="mb-3">
                <label class="form-label">Status:</label>
                <input name="status" type="text" class="form-control" th:value="${recinto.status}">
            </div>

            <div class="mb-3">
                <label class="form-label">Tratadores:</label>
                <select name="tratadorIds" multiple class="form-select">
                    <option th:each="t : ${tratadores}"
                            th:value="${t.id}"
                            th:text="${t.nome}"
                            th:selected="${recinto.tratadorIds.contains(t.id)}">
                    </option>
                </select>
            </div>

            <div class="mb-3 d-flex gap-2 mt-3">
                <button class="btn btn-primary" type="submit">Salvar</button>
                <a th:href="@{/recintos}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </div>

    <script th:src="@{/js/recintosPages/editar.js}"></script>
</body>
</html>
