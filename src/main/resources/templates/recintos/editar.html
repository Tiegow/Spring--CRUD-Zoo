<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Recinto</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>
            <a th:href="@{/recintos}" class="btn btn-outline-secondary border-0" title="Voltar">
                <i class="fa-solid fa-angle-left"></i>
            </a>
            Editar Recinto
        </h1>
        <p class="lead" th:text="${recinto.nome}">Nome do Recinto</p>
    </div>

    <div class="container mt-3">
        <form id="editar-recinto-form" th:attr="data-id=${recinto.id}">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input id="nome" name="nome" type="text" class="form-control" th:value="${recinto.nome}" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="areaHabitavel" class="form-label">Área Habitável (m²):</label>
                    <input id="areaHabitavel" name="areaHabitavel" type="number" step="0.01" class="form-control" th:value="${recinto.areaHabitavel}" required>
                </div>
                <div class="col-md-6">
                    <label for="status" class="form-label">Status:</label>
                    <select required class="form-select" id="status" name="status">
                        <option value="ABERTO" th:selected="${recinto.status == 'ABERTO'}">Aberto</option>
                        <option value="FECHADO" th:selected="${recinto.status == 'FECHADO'}">Fechado</option>
                        <option value="MANUTENCAO" th:selected="${recinto.status == 'MANUTENCAO'}">Em Manutenção</option>
                    </select>
                </div>
            </div>
            
            <div class="mb-3 p-3 border rounded bg-light">
                <h5 class="form-label">Plano de Dieta</h5>
                <p class="form-text text-muted">Ajuste os valores do plano de dieta associado a este recinto.</p>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="planoCarne" class="form-label">Quantidade de Carne (g):</label>
                        <input id="planoCarne" name="quantidadeCarne" type="number" class="form-control" 
                               th:value="${recinto.planoDieta?.quantidadeCarne}" value="0" required>
                    </div>
                    <div class="col-md-6">
                        <label for="planoVegetais" class="form-label">Quantidade de Vegetais (g):</label>
                        <input id="planoVegetais" name="quantidadeVegetais" type="number" class="form-control" 
                               th:value="${recinto.planoDieta?.quantidadeVegetais}" value="0" required>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="tratadorIds" class="form-label">Tratadores:</label>
                <select name="tratadorIds" id="tratadorIds" multiple class="form-select" size="5">
                    <option th:each="t : ${tratadores}"
                            th:value="${t.id}"
                            th:text="${t.nome}"
                            th:selected="${recinto.tratadorIds != null && recinto.tratadorIds.contains(t.id)}">
                    </option>
                </select>
                <small class="form-text text-muted">Segure Ctrl (ou Cmd) para selecionar múltiplos.</small>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Animais no Recinto:</label>
                <ul class="list-group">
                    <li class="list-group-item"
                        th:each="a : ${animais}"
                        th:if="${recinto.animaisIds != null && recinto.animaisIds.contains(a.id)}"
                        th:text="${a.nome} + ' (' + ${a.especieNome} + ')'">
                    </li>
                    <li class="list-group-item text-muted"
                        th:if="${recinto.animaisIds == null or recinto.animaisIds.isEmpty()}">
                        Nenhum animal neste recinto.
                    </li>
                </ul>
                <small class="form-text text-muted">A alocação de animais deve ser feita na página do Animal.</small>
            </div>


            <div class="mb-3 d-flex gap-2 mt-3">
                <button class="btn btn-primary" type="submit">Salvar Alterações</button>
                <a th:href="@{/recintos}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </div>

    <script th:src="@{/js/recintosPages/editar.js}"></script>
</body>
</html>
