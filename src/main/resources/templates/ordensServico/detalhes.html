<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Ordem de Serviço</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h1>
        <h1 class="mb-4"><a th:href="@{/ordensServico}"><i class="fa-solid fa-angle-left"></i></a><span th:text="${os.descricao}"></span></h1>
    </h1>
</div>

<div class="container mt-3">
    <div class="card">
        <div class="card-body">

            <h5 class="card-title">Informações da Ordem de Serviço</h5>

            <dl class="row mt-3">

                <dt class="col-sm-3">ID:</dt>
                <dd class="col-sm-9" th:text="${os.id}"></dd>

                <dt class="col-sm-3">Descrição:</dt>
                <dd class="col-sm-9" th:text="${os.descricao}"></dd>

                <dt class="col-sm-3">Status:</dt>
                <dd class="col-sm-9" th:text="${os.status}"></dd>

                <dt class="col-sm-3">Data de Início:</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(os.dataInicio, 'dd/MM/yyyy')}"></dd>

                <dt class="col-sm-3">Data de Conclusão:</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(os.dataConclusao, 'dd/MM/yyyy')}"></dd>

                <dt class="col-sm-3">Local:</dt>
                <dd class="col-sm-9" th:text="${os.local}"></dd>

                <dt class="col-sm-3">Funcionários:</dt>
                <dd class="col-sm-9">
                    <ul>
                        <li th:each="f : ${os.funcionarios}" th:text="${f.nome}"></li>
                    </ul>
                </dd>

            </dl>

            <div class="mt-3">
                <a th:href="@{/ordensServico}" class="btn btn-secondary">Voltar</a>
                <a sec:authorize="hasAnyRole('ADMIN','GERENTE_OPERACOES')"
                   th:href="@{/ordensServico/editar/{id}(id=${os.id})}"
                   class="btn btn-primary">Editar</a>

                <button sec:authorize="hasRole('ADMIN')" 
                        id="btn-delete" 
                        class="btn btn-danger"
                        th:attr="data-id=${os.id}">
                    Excluir
                </button>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/ordensServicoPages/detalhes.js}"></script>

</body>
</html>
