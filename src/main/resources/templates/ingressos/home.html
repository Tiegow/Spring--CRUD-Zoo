<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingressos</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">SIGZoo - Início</a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3">
                    <strong sec:authentication="name">Usuário</strong> - <span sec:authentication="principal.perfil">PERFIL</span>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4"><a th:href="@{/}"><i class="fa-solid fa-angle-left"></i></a> Ingressos</h1>
    </div>

    <div class="container d-flex justify-content-between align-items-start mb-4">
        <div class="d-flex align-items-start gap-2 w-100">
            <label class="visually-hidden" for="filtro-tipo">Filtrar por</label>
            
            <select id="filtro-tipo" class="form-select form-select-sm me-2" style="max-width:200px;">
                <option value="Filtros" selected>Filtros</option>
                <option value="Preco">Preço</option>
                <option value="DataCompra">Data da Compra</option>
                <option value="DataVisita">Data da Visita</option>
            </select>

            <div id="filtro-dinamico" class="d-flex gap-2 align-items-center me-2">
                
                <div class="d-none d-flex gap-2 align-items-center" id="filtro-preco">
                    <input type="number" id="precoMin" class="form-control form-control-sm" placeholder="Mín R$" style="width: 100px;">
                    <input type="number" id="precoMax" class="form-control form-control-sm" placeholder="Máx R$" style="width: 100px;">
                </div>

                <div class="d-none d-flex gap-2 align-items-center" id="filtro-data-compra">
                    <label class="form-label mb-0 small">De:</label>
                    <input type="date" id="inicioCompra" class="form-control form-control-sm">
                    <label class="form-label mb-0 small">Até:</label>
                    <input type="date" id="fimCompra" class="form-control form-control-sm">
                </div>

                <div class="d-none d-flex gap-2 align-items-center" id="filtro-data-visita">
                    <label class="form-label mb-0 small">De:</label>
                    <input type="date" id="inicioVisita" class="form-control form-control-sm">
                    <label class="form-label mb-0 small">Até:</label>
                    <input type="date" id="fimVisita" class="form-control form-control-sm">
                </div>

            </div>

            <div class="btn-group">
                <button id="btn-aplicar-filtro" class="btn btn-primary btn-sm">Filtrar</button>
                <button id="btn-limpar-filtro" class="btn btn-outline-secondary btn-sm">Limpar</button>
            </div>
        </div>

        <div sec:authorize="hasAnyRole('ADMIN')">
            <a th:href="@{/ingressos/novo}"
                 class="btn btn-primary btn-lg rounded-circle d-flex align-items-center justify-content-center shadow"
                 title="Novo ingresso manual"
                 style="width: 50px; height: 50px;">
                <span><i class="fa-solid fa-plus fa-xs"></i></span>
            </a>
        </div>
    </div>

    <div class="container">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Data da Visita</th>
                    <th scope="col">Hora</th>
                    <th scope="col">Data da Compra</th>
                    <th scope="col">Valor</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ingresso : ${ingressos.content}">
                    <td th:text="${'#' + ingresso.idIngresso}"></td>    
                    
                    <td th:text="${#temporals.format(ingresso.dataVisita, 'dd/MM/yyyy')}"></td>
                    
                    <td th:text="${ingresso.horaVisita}"></td>
                    
                    <td th:text="${#temporals.format(ingresso.dataCompra, 'dd/MM/yyyy')}"></td>
                    
                    <td th:text="${'R$ ' + #numbers.formatDecimal(ingresso.custo, 1, 'POINT', 2, 'COMMA')}"></td>

                    <td class="text-end">
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/ingressos/editar/{id}(id=${ingresso.idIngresso})}" class="text-decoration-none text-warning ms-2" title="Editar">
                            <i class="fa-solid fa-pen-to-square fa-lg"></i>
                        </a>
                    </td>
                </tr>
                
                <tr th:if="${ingressos.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Nenhum ingresso encontrado.</td>
                </tr>
            </tbody>
        </table>
        
        <nav aria-label="Page navigation" th:if="${ingressos.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${ingressos.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/ingressos(page=${ingressos.number - 1}, size=${ingressos.size}, 
                       precoMin=${param.precoMin}, precoMax=${param.precoMax}, 
                       inicioCompra=${param.inicioCompra}, fimCompra=${param.fimCompra}, 
                       inicioVisita=${param.inicioVisita}, fimVisita=${param.fimVisita})}">Anterior</a>
                </li>

                <li class="page-item disabled">
                    <span class="page-link" th:text="|Página ${ingressos.number + 1} de ${ingressos.totalPages}|"></span>
                </li>

                <li class="page-item" th:classappend="${ingressos.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/ingressos(page=${ingressos.number + 1}, size=${ingressos.size},
                       precoMin=${param.precoMin}, precoMax=${param.precoMax}, 
                       inicioCompra=${param.inicioCompra}, fimCompra=${param.fimCompra}, 
                       inicioVisita=${param.inicioVisita}, fimVisita=${param.fimVisita})}">Próximo</a>
                </li>
            </ul>
        </nav>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/visitantes/home.js}"></script>
</body>
</html>
