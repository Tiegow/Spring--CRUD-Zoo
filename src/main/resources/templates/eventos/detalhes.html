<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Evento</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1><a th:href="@{/eventos}"><i class="fa-solid fa-angle-left"></i></a> <span th:text="${evento.nome}"></span></h1>
    </div>

    <div class="container mt-3">
        <div class="card">
            <div class="card-body">

                <h5 class="card-title">Informações do Evento</h5>

                <dl class="row mt-3">

                    <dt class="col-sm-3">Nome:</dt>
                    <dd class="col-sm-9" th:text="${evento.nome}"></dd>

                    <dt class="col-sm-3">Data:</dt>
                    <dd class="col-sm-9" th:text="${#dates.format(evento.data, 'dd/MM/yyyy')}"></dd>

                    <dt class="col-sm-3">Capacidade:</dt>
                    <dd class="col-sm-9" th:text="${evento.capacidade}"></dd>

                    <dt class="col-sm-3">Tipo:</dt>
                    <dd class="col-sm-9" th:text="${evento.tipo}"></dd>

                    <dt class="col-sm-3">Recintos:</dt>
                    <dd class="col-sm-9">
                        <ul>
                            <li th:each="r : ${recintos}"
                                th:if="${evento.recintosIds.contains(r.id)}"
                                th:text="${r.nome}">
                            </li>
                        </ul>
                    </dd>

                </dl>

                <div class="mt-3">
                    <a th:href="@{/eventos}" class="btn btn-secondary">Voltar</a>
                    <a th:href="@{/eventos/editar/{id}(id=${evento.id})}" class="btn btn-primary">Editar</a>
                    <button id="btn-delete" class="btn btn-danger" th:attr="data-id=${evento.id}">Excluir</button>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/js/eventosPages/detalhes.js}"></script>
</body>
</html>
