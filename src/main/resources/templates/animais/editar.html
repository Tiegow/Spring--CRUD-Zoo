<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais - Editar</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-1"><i class="fa-solid fa-paw me-2"></i>Editar Registro - Animal</h1>
        <p class="lead" th:text="${animal.nome}">Nome do Animal</p>
    </div>

    <div class="container edit-form">
        <form id="edit-form" th:attr="data-id=${animal.id}">
            
            <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input required type="text" class="form-control" id="nome" name="nome" placeholder="Nome" th:value="${animal.nome}">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label for="select-especie" class="form-label">Espécie:</label>
                    <select id="select-especie" name="especieId" class="form-select" required>
                        <option value="">Selecione a Espécie</option>
                        <option th:each="esp : ${especies}" 
                                th:value="${esp.id}" 
                                th:text="${esp.nome}"
                                th:selected="${animal.especieId == esp.id}"
                                th:data-area-adequada="${esp.areaAdequada}">
                        </option>
                    </select>
                </div>
                
                <div class="col-md-4">
                    <label for="select-recinto" class="form-label">Recinto:</label>
                    <select id="select-recinto" name="recintoId" class="form-select">
                        <option value="">Selecione o Recinto</option>
                        <option th:each="rec : ${recintos}" 
                                th:value="${rec.id}" 
                                th:text="${rec.nome}"
                                th:selected="${animal.recintoId == rec.id}"
                                th:data-area-habitavel="${rec.areaHabitavel}">
                        </option>
                    </select>
                    
                    <div id="recinto-aviso-area" class="form-text text-warning d-none mt-1">
                        <small>
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            Atenção: A área deste recinto é menor que a adequada para a espécie.
                        </small>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <label for="select-veterinario" class="form-label">Veterinário:</label>
                    <select id="select-veterinario" name="veterinarioId" class="form-select">
                        <option value="">Selecione o Veterinário</option>
                        <option th:each="vet : ${veterinarios}" 
                                th:value="${vet.id}" 
                                th:text="${vet.nome}"
                                th:selected="${animal.veterinarioId == vet.id}">
                        </option>
                    </select>
                </div>
            </div> 

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="nascimento" class="form-label">Data de Nascimento:</label>
                    <input type="date" class="form-control" id="nascimento" name="nascimento" th:value="${animal.nascimento}">
                </div>
                
                <div class="col-md-6" id="sexo">
                    <label class="form-label">Sexo:</label>
                    <div class="d-flex align-items-center gap-3" style="padding-top: .5rem;">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sexo" id="sexo-macho" value="M" th:checked="${animal.sexo == 'M'}">
                            <label class="form-check-label" for="sexo-macho">Macho</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sexo" id="sexo-femea" value="F" th:checked="${animal.sexo == 'F'}">
                            <label class="form-check-label" for="sexo-femea">Fêmea</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="origem" class="form-label">Origem:</label>
                <input type="text" class="form-control" id="origem" name="origem" placeholder="Ex: Resgate de área vulnerável" th:value="${animal.origem}">
            </div>

            <div class="mt-4">
                <button id="edit-submit" type="submit" class="btn btn-primary">Salvar Alterações</button>
                <a th:href="@{/animais}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/animaisPages/editar.js}"></script>
</body>
</html>
