<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espécies - Detalhes</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1 class="mb-4">
            <i class="fa-solid fa-dna me-2"></i>
            <span th:text="${especie.nome}"></span>
        </h1>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-body">

                <h5 class="card-title mb-4">Detalhes da Espécie</h5>

                <dl class="row">
                    <dt class="col-sm-4">Nome:</dt>
                    <dd class="col-sm-8" th:text="${especie.nome}"></dd>

                    <dt class="col-sm-4">Expectativa de Vida:</dt>
                    <dd class="col-sm-8" th:text="${especie.expectativaVida}"></dd>

                    <dt class="col-sm-4">Área Adequada:</dt>
                    <dd class="col-sm-8" th:text="${especie.areaAdequada}"></dd>

                    <dt class="col-sm-4">Tamanho Mínimo do Grupo:</dt>
                    <dd class="col-sm-8" th:text="${especie.tamanhoMinimoGrupo}"></dd>

                    <dt class="col-sm-4">Tamanho Máximo do Grupo:</dt>
                    <dd class="col-sm-8" th:text="${especie.tamanhoMaximoGrupo}"></dd>
                </dl>

                <div class="mt-3">
                    <a th:href="@{/especies}" class="btn btn-secondary me-2">
                        <i class="fa-solid fa-arrow-left me-1"></i>Voltar
                    </a>

                    <a th:href="@{/especies/editar/{id}(id=${especie.id})}" class="btn btn-primary me-2">
                        <i class="fa-solid fa-pen-to-square me-1"></i>Editar
                    </a>

                    <button type="button" class="btn btn-danger" id="delete-btn" 
                        th:attr="data-id=${especie.id}">
                        <i class="fa-solid fa-trash me-1"></i>Deletar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/especiesPages/detalhes.js}"></script>

</body>
</html>
