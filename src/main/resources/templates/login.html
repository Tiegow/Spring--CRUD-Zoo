<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGZOO - Login</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/7.0.1/css/all.min.css}" rel="stylesheet">
</head>
<body>
    <div class="container pt-5">
        <div class="card card-login shadow-sm bg-light rounded mt-5 mx-auto" style="width: 20rem;">
        <div class="card-body bg-light">
            <h3 class="text-center mb-4">Acesso ao SIGZoo</h3>

            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

            <div th:if="${param.error}" class="alert alert-danger">
                Usuário ou senha inválidos.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                Você saiu do sistema com sucesso.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">E-mail</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="ex: admin@zoo.com" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">Entrar</button>
                </div>
            </form>
            
            <div class="text-center mt-3">
                <small class="text-muted">Esqueceu a senha? Contate o administrador.</small>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/cadastro}">Não tem conta? Cadastre-se</a>
            </div>
        </div>
    </div>
    </div>
    
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
